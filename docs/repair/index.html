  <title>夫婦関係の悪化と修復 — 体験談117件</title>
  <style>
    :root { color-scheme:light; --bg:#f4f3ee; --paper:#fff; --ink:#17201c; --muted:#68736d; --line:#d8dfda; --green:#205947; --red:#8a443b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; line-height:1.7; }
    main { width:min(920px,calc(100% - 36px)); margin:auto; padding:76px 0; }
    nav { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:52px; }
    nav a { padding:8px 12px; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:inherit; text-decoration:none; }
    .eyebrow { margin:0 0 10px; color:var(--muted); font-size:.78rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font:700 clamp(2.3rem,6vw,4.6rem)/1.12 Georgia,"Yu Mincho",serif; letter-spacing:-.035em; }
    .lede { max-width:710px; margin:20px 0 42px; color:var(--muted); font-size:1.05rem; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .card { display:block; padding:28px; border:1px solid var(--line); border-radius:18px; background:var(--paper); color:inherit; text-decoration:none; box-shadow:0 12px 32px rgba(23,32,28,.05); }
    .card:hover { border-color:var(--green); }
    .card span { color:var(--muted); font-size:.8rem; font-weight:800; }
    .card h2 { margin:8px 0 9px; font:700 1.55rem/1.25 Georgia,"Yu Mincho",serif; }
    .card p { margin:0; color:var(--muted); }
    .counts { display:flex; gap:8px; margin-top:16px; }
    .counts b { padding:5px 9px; border-radius:999px; color:#fff; background:var(--green); font-size:.76rem; }
    .counts b:last-child { background:var(--red); }
    @media (max-width:680px) { .cards { grid-template-columns:1fr; } }
  </style>
</head>
