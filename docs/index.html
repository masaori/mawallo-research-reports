<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mawallo リサーチレポート</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f2eb; --paper:#fffdf8; --ink:#24231f; --muted:#66635b; --line:#d9d3c7; --accent:#245c4b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; line-height:1.75; }
    main { width:min(880px,calc(100% - 32px)); margin:0 auto; padding:80px 0; }
    h1 { margin:0; font-size:clamp(2rem,6vw,4rem); line-height:1.15; }
    .lede { max-width:680px; color:var(--muted); font-size:1.08rem; }
    .card { display:block; margin-top:40px; padding:28px; border:1px solid var(--line); border-radius:16px; background:var(--paper); color:inherit; text-decoration:none; }
    .card:hover { border-color:var(--accent); }
    .card h2 { margin:0 0 8px; }
    .card p { margin:0; color:var(--muted); }
    @media (prefers-color-scheme:dark) { :root { --bg:#171914; --paper:#20231d; --ink:#f1efe7; --muted:#b2afa5; --line:#3d4038; --accent:#8ac6ad; } }
  </style>
</head>
<body>
  <main>
    <h1>Mawallo リサーチレポート</h1>
    <p class="lede">人間関係の理解と支援に関する調査資料を、テーマごとに公開しています。Mawalloアプリ本体とは独立した資料サイトです。</p>
    <a class="card" href="typologies/">
      <h2>夫婦支援の理論・尺度</h2>
      <p>65件のエビデンス集計、レベル1〜3の分類集計、実務上有用な6件の個別レポート。</p>
    </a>
  </main>
</body>
</html>
